[project]
name = "multistream-vision-watchdog"
version = "0.1.0"
description = "Multri stream video analysis"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "onnxruntime-gpu>=1.18.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "memory-profiler>=0.61.0",
    "matplotlib>=3.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
